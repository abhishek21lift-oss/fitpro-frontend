const ReEvalModal = () => {
  const { showReEval, setShowReEval, setScreen } = useApp();

  const [accepted, setAccepted] = useState({});
  const client = MOCK.clients[0];

  if (!showReEval) return null;

  const suggestions = [
    { id: 'calories', label: 'Calories', current: '1,750 kcal', suggested: '1,650 kcal', change: '-100 kcal', reason: 'Weight loss plateau detected', accepted: accepted.calories },
    { id: 'protein', label: 'Protein', current: '130g', suggested: '140g', change: '+10g', reason: 'Increase for muscle preservation', accepted: accepted.protein },
    { id: 'carbs', label: 'Carbs', current: '175g', suggested: '155g', change: '-20g', reason: 'Reduce on rest days', accepted: accepted.carbs },
    { id: 'volume', label: 'Training Volume', current: '16 sets/muscle/wk', suggested: '18 sets/muscle/wk', change: '+2 sets', reason: 'Increase intensity for continued progress', accepted: accepted.volume }
  ];

  const goalVsActual = [
    { metric: 'Weight', goal: '72 → 68 kg', actual: '72 → 71.5 kg', status: 'behind' },
    { metric: 'Body Fat', goal: '31% → 28%', actual: '31% → 28.8%', status: 'on-track' },
    { metric: 'Adherence', goal: '95%', actual: '90%', status: 'close' },

    { metric: 'Water Intake', goal: '3L/day', actual: '2.8L/day', status: 'close' }
  ];

  const statusStyle = (s) => {
    if (s === 'on-track') return 'badge-success';
    if (s === 'close') return 'badge-warning';
    return 'badge-danger';
  };

  const toggleAccept = (id) => {
    setAccepted(prev => ({ ...prev, [id]: !prev[id] }));

  const handleRegenerate = () => {
    setRegenerating(true);
    setTimeout(() => {
      setRegenerating(false);
      setShowReEval(false);
      setScreen('processing');
    }, 800);
  };

  return React.createElement('div', {
    className: 'modal-overlay',
    onClick: (e) => { if (e.target === e.currentTarget) setShowReEval(false); },
    role: 'dialog',
    'aria-modal': 'true',

  },

          React.createElement('p', { className: 'text-sm text-gray-500' }, `Week ${client.programWeek} · Based on latest progress data for ${client.name}`)
        ),
        React.createElement(IconButton, { icon: X, label: 'Close', onClick: () => setShowReEval(false) })
      ),
      // Goal vs Actual
      React.createElement('div', { className: 'mb-6' },
        React.createElement('h3', { className: 'text-sm font-semibold text-gray-900 mb-3' }, 'Goal vs Actual'),
        React.createElement('div', { className: 'overflow-x-auto' },
          React.createElement('table', { className: 'w-full text-sm' },
            React.createElement('thead', null,
              React.createElement('tr', { className: 'border-b border-gray-100' },
                React.createElement('th', { className: 'text-left py-2 px-3 text-gray-500 font-medium' }, 'Metric'),
                React.createElement('th', { className: 'text-left py-2 px-3 text-gray-500 font-medium' }, 'Goal'),
                React.createElement('th', { className: 'text-left py-2 px-3 text-gray-500 font-medium' }, 'Actual'),
                React.createElement('th', { className: 'text-right py-2 px-3 text-gray-500 font-medium' }, 'Status')
              )
            ),
            React.createElement('tbody', null,
              goalVsActual.map((g, i) =>
                React.createElement('tr', { key: i, className: 'border-b border-gray-50' },
                  React.createElement('td', { className: 'py-3 px-3 font-medium text-gray-900' }, g.metric),
                  React.createElement('td', { className: 'py-3 px-3 text-gray-600' }, g.goal),
                  React.createElement('td', { className: 'py-3 px-3 text-gray-600' }, g.actual),
                  React.createElement('td', { className: 'py-3 px-3 text-right' },
                    React.createElement('span', { className: `badge ${statusStyle(g.status)}` },
                      g.status === 'on-track' ? 'On Track' : g.status === 'close' ? 'Needs Attention' : 'Behind'
                    )
                  )
                )
              )
            )
          )
        )
      ),
      // AI Suggestions
      React.createElement('div', { className: 'mb-6' },
        React.createElement('h3', { className: 'text-sm font-semibold text-gray-900 mb-3' }, 'AI Suggested Adjustments'),
        React.createElement('div', { className: 'space-y-2' },
          suggestions.map((s) =>

              key: s.id,
              className: `flex items-center gap-4 p-4 rounded-xl border transition-all ${s.accepted ? 'border-green-200 bg-green-50' : 'border-gray-100 hover:border-gray-200 bg-white'}`
            },
              React.createElement('div', { className: 'flex-1' },
                React.createElement('div', { className: 'text-sm font-medium text-gray-900' }, s.label),
                React.createElement('div', { className: 'flex items-center gap-3 mt-1 text-xs text-gray-500' },

                  React.createElement(ArrowRight, { size: 12 }),
                  React.createElement('span', null, 'Suggested: ', React.createElement('span', { className: 'text-[#2563EB] font-medium' }, s.suggested)),
                  React.createElement('span', { className: `font-medium ${s.change.startsWith('+') ? 'text-green-600' : 'text-red-600'}` }, s.change)
                ),
                React.createElement('p', { className: 'text-xs text-gray-400 mt-1' }, s.reason)
              ),
              React.createElement('button', {
                onClick: () => toggleAccept(s.id),
                className: `btn btn-sm ${s.accepted ? 'btn-success' : 'btn-secondary'}`
              }, s.accepted ? React.createElement(Check, { size: 14 }) : null, s.accepted ? 'Accepted' : 'Accept')
            )
          )
        )
      ),
      // Regenerate button
      React.createElement('button', {
        onClick: handleRegenerate,
